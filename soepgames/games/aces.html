      import React, {

      // --- PHYSICS CONSTANTS ---
      const CANVAS_WIDTH = 840,

      const shuffle = (array) => {
        let currentIndex = array.length,
          randomIndex;
        while (currentIndex !== 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [
            array[randomIndex],
            array[currentIndex],
          ];
        }
        return array;
      };

      // --- Audio System ---
      const AudioSystem = (() => {
        let ctx = null;
        const init = () => {
          if (!ctx)
            ctx = new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === "suspended") ctx.resume();
        };
        const playEffect = (type, intensity = 1.0) => {
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          const now = ctx.currentTime;
          switch (type) {
            case "jump":
              osc.frequency.setValueAtTime(150, now);
              osc.frequency.exponentialRampToValueAtTime(320, now + 0.1);
              gain.gain.setValueAtTime(0.04, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
              break;
            case "land":
              osc.type = "triangle";
              osc.frequency.setValueAtTime(80, now);
              osc.frequency.exponentialRampToValueAtTime(40, now + 0.1);
              gain.gain.setValueAtTime(0.05 * intensity, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
              break;
            case "success":
              osc.type = "sine";
              osc.frequency.setValueAtTime(523, now);
              osc.frequency.setValueAtTime(1046, now + 0.1);
              gain.gain.setValueAtTime(0.06, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
              break;
            case "death":
              osc.type = "sawtooth";
              osc.frequency.setValueAtTime(80 + intensity * 20, now);
              osc.frequency.linearRampToValueAtTime(20, now + 0.2);
              gain.gain.setValueAtTime(0.1, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
              break;
            case "wrong":
              osc.type = "square";
              osc.frequency.setValueAtTime(150, now);
              osc.frequency.linearRampToValueAtTime(50, now + 0.3);
              gain.gain.setValueAtTime(0.1, now);
              gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
              break;
          }
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        };
        return { init, playEffect };
      })();

      // --- Interactive Graph Component ---
      const InteractiveGraph = ({
        data,
        color,
        label,
        height = 80,
        sectorInfo,
      }) => {
        const [hoverIdx, setHoverIdx] = useState(null);
        const containerRef = useRef(null);

        if (!data || data.length < 2) return null;

        const max = Math.max(...data, 0.1);
        const min = Math.min(...data, 0);
        const range = max - min || 1;

        const points = data
          .map((d, i) => {
            const x = (i / (data.length - 1)) * 100;
            const y = 100 - ((d - min) / range) * 100;
            return `${x},${y}`;
          })
          .join(" ");

        const handleMouseMove = (e) => {
          if (!containerRef.current) return;
          const rect = containerRef.current.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const idx = Math.min(
            data.length - 1,
            Math.max(0, Math.round((x / rect.width) * (data.length - 1))),
          );
          setHoverIdx(idx);
        };

        return React.createElement(
          "div",
          { className: "w-full mb-4 group" },
          React.createElement(
            "div",
            {
              className:
                "flex justify-between text-[9px] opacity-60 font-mono mb-1 uppercase tracking-widest",
            },
            React.createElement("span", { style: { color } }, label),
            React.createElement("span", null, "TIMELINE"),
          ),
          React.createElement(
            "div",
            {
              ref: containerRef,
              className:
                "relative w-full bg-white/5 border border-white/10 cursor-crosshair",
              style: { height: `${height}px` },
              onMouseMove: handleMouseMove,
              onMouseLeave: () => setHoverIdx(null),
            },
            React.createElement(
              "svg",
              {
                viewBox: "0 0 100 100",
                preserveAspectRatio: "none",
                className: "w-full h-full",
              },
              React.createElement("line", {
                x1: 0,
                y1: 25,
                x2: 100,
                y2: 25,
                stroke: "rgba(255,255,255,0.05)",
                strokeWidth: 0.5,

                strokeWidth: 0.5,

                fill: "none",
                stroke: color,

                points: points,

                }),

                  stopOpacity: 0,
                }),
              ),
              React.createElement("polygon", {
                fill: `url(#grad_${label})`,
                points: `0,100 ${points} 100,100`,
              }),
              hoverIdx !== null &&
                React.createElement("line", {
                  x1: (hoverIdx / (data.length - 1)) * 100,
                  y1: 0,
                  x2: (hoverIdx / (data.length - 1)) * 100,
                  y2: 100,
                  stroke: "white",
                  strokeWidth: 0.5,
                  strokeDasharray: "2 1",
                }),
              hoverIdx !== null &&

                  cx: (hoverIdx / (data.length - 1)) * 100,
                  cy: 100 - ((data[hoverIdx] - min) / range) * 100,
                  r: 2,
                  fill: "white",
                }),
            ),
            hoverIdx !== null &&
              React.createElement(
                "div",
                {
                  className: "graph-tooltip",
                  style: {
                    left: `${(hoverIdx / (data.length - 1)) * 100}%`,
                    top: `${100 - ((data[hoverIdx] - min) / range) * 100}%`,
                  },
                },

                  "div",
                  { className: "text-white font-bold" },

      };

      // --- Enhanced Spider Chart ---
      const SpiderChart = ({ data, size = 180 }) => {
        const labels = ["RSK", "PAT", "ADP", "CNS", "CNF"];
        const r = size * 0.38,
          c = size / 2;
        const getPt = (v, i) => {
          const a = Math.PI / 2 + i * ((2 * Math.PI) / 5);
          const val = Math.max(0.1, Math.min(1.1, v));
          return { x: c + val * r * Math.cos(a), y: c - val * r * Math.sin(a) };
        };

        const pts = data.map((v, i) => getPt(v, i));
        const path =
          pts.map((p, i) => (i === 0 ? "M" : "L") + p.x + "," + p.y).join(" ") +

      // --- Particle System ---
      class ParticleSystem {
        constructor() {
          this.particles = [];
        }
        spawn(x, y, color, count = 5) {
          for (let i = 0; i < count; i++) {
            this.particles.push({
              x,
              y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              life: 1.0,
              color,
            });
          }
        }
        update() {
          this.particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
          });
          this.particles = this.particles.filter((p) => p.life > 0);
        }
        draw(ctx) {
          this.particles.forEach((p) => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.fillRect(p.x, p.y, 2, 2);
          });
          ctx.globalAlpha = 1;
        }
      }

          criteria: "Hesitation Spikes > 10",
        },
        {
          id: "STOP-GO MECHANIC",
          desc: "Inconsistent rhythm. Binary movement patterns.",
          criteria: "Momentum Breaks > 20",
        },
        {
          id: "THE STUMBLER",
          desc: "Motor skills intact, logic processing flawed.",
          criteria: "Logic Fails > Logic Wins",
        },
        {
          id: "LOGIC CORE",
          desc: "Perfect cognitive score. Pathing optimization active.",
          criteria: "100% Logic Success",
        },
        {
          id: "THE PACIFIST",
          desc: "Conflict avoidance pathing. Minimal interaction.",
          criteria: "0 Risk, Deaths < 5",
        },
        {
          id: "THE PHOENIX",
          desc: "Critical failures followed by immediate recovery.",
          criteria: "Recoveries > 3",
        },
        {
          id: "THE TORTOISE",
          desc: "Slow, methodical, inevitable progress.",
          criteria: "Slow Time, Full Completion",
        },
        {
          id: "LATERAL BIASED",
          desc: "Severe spatial preference detected.",
          criteria: "L/R Frame Bias > 10000",
        },
        {
          id: "THE GROUNDED",
          desc: "Aversion to verticality and aerial maneuvers.",
          criteria: "Total Jumps < 60",
        },
        {
          id: "ADRENALINE JUNKIE",
          desc: "Performance peaks only under maximum stress.",
          criteria: "High Intensity Spikes",
        },
        {
          id: "THE VICTIM",
          desc: "Takes no risks, yet still fails. Statistical anomaly.",
          criteria: "0 Risk, Deaths > 10",
        },
        {
          id: "FATIGUE SUBJECT",
          desc: "Cognitive and motor performance degrades over time.",
          criteria: "Negative Learning Trend",
        },
        {
          id: "THE WILDCARD",
          desc: "Thrives on unpredictable choices. Inconsistent outcomes.",
          criteria: "Risk Success > 5",
        },
        {
          id: "STANDARD OBSERVER",
          desc: "Baseline human performance.",
          criteria: "Average Metrics",
        },
      ];

      // NIEUW VERBETERD ARCHETYPE LOGICA SYSTEEM: MULTI-DIMENSIONAL VECTOR MATCHING
      const generatePsychProfile = (data) => {
        const { totalTime, totalJumps, deaths, metrics, detailedHistory } =
          data;
        const timeSecs = parseFloat(totalTime);
        const hesitationSpikes = detailedHistory.filter(
          (h) => h.hesitation > 2000,
        ).length;
        const totalMomentumBreaks = detailedHistory.reduce(
          (a, b) => a + (b.momentumBreaks || 0),
          0,
        );

        let totalLeft = 0,
          totalRight = 0;
        detailedHistory.forEach((h) => {
          totalLeft += h.leftFrames || 0;
          totalRight += h.rightFrames || 0;
        });

        const riskTaken = parseInt(metrics.riskRate.split("/")[1]) || 0;
        const riskSuccess = parseInt(metrics.riskRate.split("/")[0]) || 0;
        const logicFails = detailedHistory.filter(
          (h) => h.isCorrect === false,
        ).length;
        const logicWins = detailedHistory.filter(
          (h) => h.isCorrect === true,
        ).length;
        const logicRate =
          logicWins + logicFails > 0
            ? logicWins / (logicWins + logicFails)
            : 0.5;
        const learningT = parseFloat(metrics.learningTrend);

        // --- VECTOR EMBEDDING (6D Feature Space) ---
        // We project the subject's behavioral data into a normalized 0.0 - 1.0 multi-dimensional array
        const vRisk = Math.min(1.0, riskTaken / 10);
        const vPace = Math.max(0.0, Math.min(1.0, 1.0 - (timeSecs - 80) / 300)); // 80s=1, 380s=0
        const vPrecision =
          deaths === 0 ? 1.0 : Math.max(0.0, 1.0 - deaths / 25); // 0 deaths=1, 25+ deaths=0
        const vLogic = logicRate;
        const vMomentum = Math.max(0.0, 1.0 - totalMomentumBreaks / 30); // fewer breaks = higher momentum
        const vHesitation = Math.min(1.0, hesitationSpikes / 15);

        const userVector = [
          vRisk,
          vPace,
          vPrecision,
          vLogic,
          vMomentum,
          vHesitation,
        ];

        // --- CENTROIDS (Ideal Archetype Vectors) ---
        // [Risk, Pace, Precision, Logic, Momentum, Hesitation]
        const centroids = {
          "THE SINGULARITY": [0.8, 1.0, 1.0, 1.0, 1.0, 0.0],
          "GOD MODE": [1.0, 0.8, 1.0, 1.0, 0.9, 0.0],
          "CHAOS ENGINE": [1.0, 0.9, 0.0, 0.4, 0.8, 0.0],
          "THE SURVIVOR": [0.0, 0.4, 1.0, 0.8, 0.5, 0.6],
          "ENTROPY AVATAR": [0.6, 0.8, 0.0, 0.5, 1.0, 0.0],
          "THE WATCHER": [0.1, 0.1, 0.8, 0.9, 0.2, 0.9],
          "APEX PREDATOR": [0.9, 0.9, 0.8, 0.8, 0.9, 0.1],
          "ICARUS COMPLEX": [0.9, 0.8, 0.2, 0.6, 0.8, 0.1],
          "NERVOUS SYSTEM": [0.4, 0.7, 0.2, 0.4, 0.4, 0.8],
          "NEURAL ADAPTIVE": [0.7, 0.6, 0.6, 0.9, 0.7, 0.4],
          "SPEED DEMON": [0.8, 1.0, 0.4, 0.6, 1.0, 0.0],
          "THE HESITANT": [0.2, 0.2, 0.7, 0.7, 0.2, 1.0],
          "STOP-GO MECHANIC": [0.4, 0.4, 0.8, 0.8, 0.0, 0.8],
          "THE STUMBLER": [0.5, 0.5, 0.7, 0.0, 0.6, 0.4],
          "LOGIC CORE": [0.3, 0.6, 0.9, 1.0, 0.7, 0.3],
          "THE PACIFIST": [0.0, 0.3, 0.9, 0.8, 0.5, 0.5],
          "THE PHOENIX": [0.6, 0.6, 0.2, 0.8, 0.8, 0.2],
          "THE TORTOISE": [0.1, 0.0, 0.9, 0.9, 0.4, 0.6],
          "LATERAL BIASED": [0.5, 0.5, 0.5, 0.5, 0.5, 0.5],
          "THE GROUNDED": [0.3, 0.5, 0.8, 0.7, 0.6, 0.4],
          "ADRENALINE JUNKIE": [0.9, 0.8, 0.5, 0.6, 0.9, 0.2],
          "THE VICTIM": [0.0, 0.4, 0.1, 0.5, 0.5, 0.7],
          "FATIGUE SUBJECT": [0.4, 0.3, 0.4, 0.4, 0.4, 0.6],
          "THE WILDCARD": [0.8, 0.7, 0.4, 0.5, 0.7, 0.3],
          "STANDARD OBSERVER": [0.5, 0.5, 0.5, 0.5, 0.5, 0.5],
        };

        // Calculates Euclidean distance in multi-dimensional space
        const calcDistance = (v1, v2) =>
          Math.sqrt(
            v1.reduce((acc, val, i) => acc + Math.pow(val - v2[i], 2), 0),
          );

        let arch = "STANDARD OBSERVER";
        let bestDist = Infinity;

        for (const [key, centroid] of Object.entries(centroids)) {
          let dist = calcDistance(userVector, centroid);

          // Absolute hard constraints (Masking)
          if (key === "THE SINGULARITY" && (deaths > 0 || timeSecs > 180))
            continue;
          if (
            key === "GOD MODE" &&
            (deaths > 0 || vLogic < 1.0 || riskTaken < 3)
          )
            continue;
          if (key === "THE SURVIVOR" && deaths > 0) continue;
          if (key === "CHAOS ENGINE" && deaths < 20) continue;
          if (key === "LOGIC CORE" && vLogic < 1.0) continue;
          if (key === "THE PACIFIST" && (deaths > 3 || riskTaken > 0)) continue;
          if (
            key === "LATERAL BIASED" &&
            Math.abs(totalLeft - totalRight) < 8000
          )
            continue;

          if (dist < bestDist) {
            bestDist = dist;
            arch = key;
          }
        }

        // Vaste Traits Data voor het geselecteerde archetype
        const traitsDict = {
          "THE SINGULARITY": ["Void", "Perfect", "Infinite"],
          "GOD MODE": ["Deity", "Omni", "Gold"],
          "CHAOS ENGINE": ["Wild", "Broken", "Fast"],
          "THE SURVIVOR": ["Immortal", "Cautious", "Calculated"],
          "ENTROPY AVATAR": ["Undying", "Chaotic", "Persistent"],
          "THE WATCHER": ["Passive", "Analytical", "Frozen"],
          "APEX PREDATOR": ["Alpha", "Precise", "Dominant"],
          "ICARUS COMPLEX": ["Arrogant", "Doomed", "Volatile"],
          "NERVOUS SYSTEM": ["Anxious", "Fragile", "Reactive"],
          "NEURAL ADAPTIVE": ["Evolving", "Smart", "Fluid"],
          "SPEED DEMON": ["Fast", "Reckless", "Blur"],
          "THE HESITANT": ["Slow", "Thoughtful", "Stalled"],
          "STOP-GO MECHANIC": ["Jerky", "Robotic", "Binary"],
          "THE STUMBLER": ["Instinctive", "Dull", "Brute"],
          "LOGIC CORE": ["Smart", "Cold", "Optimal"],
          "THE PACIFIST": ["Peaceful", "Safe", "Avoidant"],
          "THE PHOENIX": ["Resilient", "Cyclical", "Reborn"],
          "THE TORTOISE": ["Patient", "Steady", "Inevitable"],
          "LATERAL BIASED": ["Skewed", "Looping", "Drifting"],
          "THE GROUNDED": ["Flat", "Heavy", "Anchor"],
          "ADRENALINE JUNKIE": ["Intense", "Wild", "Peak"],
          "THE VICTIM": ["Unlucky", "Cursed", "Passive"],
          "FATIGUE SUBJECT": ["Tired", "Weak", "Fading"],
          "THE WILDCARD": ["Lucky", "Bold", "Random"],
          "STANDARD OBSERVER": ["Average", "Balanced", "Human"],
        };

        const traits = traitsDict[arch] || traitsDict["STANDARD OBSERVER"];

        let whyParts = [];
        if (deaths === 0)
          whyParts.push(
            "Subject exhibited zero kinetic failure events (0 deaths), indicating extreme physiological optimization.",
          );
        else if (deaths > 20)
          whyParts.push(
            `Subject sustained massive kinetic trauma (${deaths} deaths) yet persisted, overriding baseline survival imperatives.`,
          );
        else
          whyParts.push(`Subject sustained ${deaths} kinetic failure events.`);

        if (riskTaken > 0) {
          const rate = Math.round((riskSuccess / Math.max(1, riskTaken)) * 100);
          whyParts.push(
            `Risk probability assessment active: high-variance paths prioritized with ${rate}% success rate.`,
          );
        } else {
          whyParts.push(
            "Risk aversion absolute. Subject mathematically refused all optional high-variance trajectories.",
          );
        }

        if (logicWins + logicFails > 0) {
          whyParts.push(
            `Cognitive logic processing operating at ${Math.round(logicRate * 100)}% efficiency capacity.`,
          );
        }

        if (hesitationSpikes > 5)
          whyParts.push(
            `Analysis paralysis detected. ${hesitationSpikes} severe temporal hesitation events logged in motor cortex.`,
          );
        if (learningT > 0)
          whyParts.push(
            "Neuroplasticity positive: Subject adaptation velocity systematically increased throughout trial.",
          );

        const humanTranslations = {
          "THE SINGULARITY":
            "You play at an superhuman level. Exceptionally fast, completely flawless, and virtually indistinguishable from an optimized AI.",
          "GOD MODE":
            "You possess absolute mastery. Perfect logical reasoning combined with high risk-taking and zero deaths.",
          "CHAOS ENGINE":
            "You thrive in high-stakes disorder, repeatedly charging ahead and failing without ever slowing down.",
          "THE SURVIVOR":
            "You prioritize safety above all else, executing careful movements to completely avoid any failure or danger.",
          "ENTROPY AVATAR":
            "Your sheer willpower is unmatched. You face immense failure but relentlessly push forward and refuse to quit.",
          "THE WATCHER":
            "You are patient and highly analytical, pausing to observe situations carefully before taking any action.",
          "APEX PREDATOR":
            "A highly skilled and aggressive risk-taker. You take dangerous shortcuts and execute them with supreme precision.",
          "ICARUS COMPLEX":
            "You attempt extreme jumps and take massive risks, but your physical execution falls short, leading to frequent errors.",
          "NERVOUS SYSTEM":
            "You tend to panic under sudden stress, leading to frantic button presses and motor coordination hiccups.",
          "NEURAL ADAPTIVE":
            "An outstanding learner. You adapt rapidly to failures, optimizing your route with remarkable neuroplasticity.",
          "SPEED DEMON":
            "You live in the fast lane, prioritizing speed and forward momentum above all else.",
          "THE HESITANT":
            "You experience analysis paralysis, frequently pausing to plan your next moves before stepping forward.",
          "STOP-GO MECHANIC":
            "Your rhythmic split-second pauses suggest a mechanical, highly methodical approach to movement.",
          "THE STUMBLER":
            "You exhibit strong platforming reflexes, but struggle to solve the logical code gates on the first try.",
          "LOGIC CORE":
            "A pure logical mind. You solved every single cognitive gated question flawlessly and quickly.",
          "THE PACIFIST":
            "You prefer a peaceful, conservative route, avoiding conflict, hazards, and optional high-risk pathways.",
          "THE PHOENIX":
            "You demonstrate incredible recovery capacity, shaking off catastrophic desync events with immediate focus.",
          "THE TORTOISE":
            "Slow, steady, and methodical. You take your time but your completion of every level is completely inevitable.",
          "LATERAL BIASED":
            "You have a distinct horizontal spatial bias, heavily favoring one side of the layout when waiting or panning.",
          "THE GROUNDED":
            "You prefer keeping your feet firmly on solid ground, minimizing verticality and aerial maneuvers.",
          "ADRENALINE JUNKIE":
            "You perform best under intense stress, completing complex sequences only when the hazard speed peaks.",
          "THE VICTIM":
            "You try to be careful and take no risks, yet still find yourself caught in unfortunate kinetic failures.",
          "FATIGUE SUBJECT":
            "Your performance shows slight cognitive and motor fatigue over time as the session progresses.",
          "THE WILDCARD":
            "You embrace unpredictable choices, frequently taking challenging paths with varying success rates.",
          "STANDARD OBSERVER":
            "You represent the steady baseline of human performance, showing a healthy balance of risk and caution.",
        };

        const riskScore = Math.min(
          100,
          Math.max(
            0,
            Math.round(
              vRisk * 60 +
                (deaths > 15 ? 20 : 0) +
                (timeSecs < 200 ? 15 : 0) -
                vHesitation * 20,
            ),
          ),
        );

        const patienceScore = Math.min(
          100,
          Math.max(
            0,
            Math.round(
              30 +
                vHesitation * 30 +
                metrics.idle * 3 +
                (1 - vMomentum) * 20 -
                vRisk * 30,
            ),
          ),
        );

        const adaptScore = Math.min(
          100,
          Math.max(
            0,
            Math.round(
              50 +
                learningT * 8 +
                metrics.recoveryFreq * 6 +
                (deaths > 5 ? 10 : 0),
            ),
          ),
        );

        const consistScore = Math.min(
          100,
          Math.max(
            0,
            Math.round(
              100 -
                deaths * 3 -
                (1 - vMomentum) * 20 -
                metrics.panic * 3 +
                vLogic * 20,
            ),
          ),
        );

        const confScore = Math.min(
          100,
          Math.max(
            0,
            Math.round(
              60 +
                vRisk * 40 +
                (timeSecs < 250 ? 20 : 0) -
                vHesitation * 40 -
                metrics.panic * 3,
            ),
          ),
        );

        const dbEntry = ARCHETYPES_DB.find((a) => a.id === arch);
        const summary = dbEntry ? dbEntry.desc : "Baseline human performance.";
        const whyAnalysis =
          whyParts.join(" ") || "Behavior aligns with standard control groups.";

        let impulse = Math.max(1, Math.min(10, 8 - metrics.panic / 3));
        let learn = Math.max(1, Math.min(10, 5 + learningT * 2));

        return {
          archetype: arch,
          summary: summary,
          humanTranslation:
            humanTranslations[arch] || humanTranslations["STANDARD OBSERVER"],
          dimensions: {
            risk: riskScore,
            patience: patienceScore,
            adapt: adaptScore,
            consist: consistScore,
            conf: confScore,
          },
          dimensionsRaw: [
            riskScore / 100,
            patienceScore / 100,
            adaptScore / 100,
            consistScore / 100,
            confScore / 100,
          ],
          risk_tolerance: riskTaken > 5 ? "High" : "Low",
          stress_response: metrics.panic > 5 ? "High" : "Stable",
          adaptability: learningT > 0 ? "Fluid" : "Rigid",
          impulse_control_score: Math.floor(impulse),
          learning_speed_score: Math.floor(learn),
          traits: traits.slice(0, 3),
          whyParts: whyParts,
          why: whyAnalysis,
        };
      };

      // --- Game Engine ---
      const GameCanvas = ({
        level,
        onComplete,
        onFail,
        onStats,
        onBehavior,
        color = "#fff",
        goalColor = "#00ff9d",
        showLabels = false,
        isAngerActive = false,
        intensity = 1.0,
      }) => {
        const canvasRef = useRef(null),
          requestRef = useRef(0);
        const particles = useRef(new ParticleSystem());

        const player = useRef({
          x: 0,
          y: 0,
          vx: 0,
          vy: 0,
          w: PLAYER_SIZE,
          h: PLAYER_SIZE,
          onGround: false,
          jumpCount: 0,
        });
        const trails = useRef([]),
          keys = useRef({});

        const tracking = useRef({
          leftFrames: 0,
          rightFrames: 0,
          stopFrames: 0,
          momentumBreaks: 0,
          jumpCoyoteTimes: [],
          deathCoords: [],
        });

        const physState = useRef({
          coyoteTimestamp: 0,
          jumpBufferTimestamp: 0,
          hasJumpedInAir: false,
          jumpCut: false,
          lastJumpTime: 0,
          jumpHistory: [],
          firstInputTime: null,
          inputHistory: [],
          landingShake: 0,
        });

        const state = useRef({
          timeScale: 1.0,
          shake: 0,
          startTime: Date.now(),
          moved: false,
          behavioralFlags: {
            jumpLog: false,
            idleLog: false,
            panicLog: false,
            riskTaken: false,
          },
          collected: [],
          goalSequence: 0,
          gravityMod: level.gravityMod || 1.0,
          timeMod: level.timeMod || 1.0,
        });

        const movingPlatforms = useRef([]);
        const movingHazards = useRef([]);
        const collectibles = useRef([]);

        const reset = useCallback(() => {
          if (!level) return;
          player.current = {
            x: level.start.x,
            y: level.start.y,
            vx: 0,
            vy: 0,
            w: PLAYER_SIZE,
            h: PLAYER_SIZE,
            onGround: false,
            jumpCount: 0,
          };
          state.current = {
            timeScale: 1.0,
            shake: 0,
            startTime: Date.now(),
            moved: false,
            behavioralFlags: {
              jumpLog: false,
              idleLog: false,
              panicLog: false,
              riskTaken: false,
            },
            collected: [],
            goalSequence: 0,
            gravityMod: level.gravityMod || 1.0,
            timeMod: level.timeMod || 1.0,
          };
          physState.current = {
            coyoteTimestamp: 0,
            jumpBufferTimestamp: 0,
            hasJumpedInAir: false,
            jumpCut: false,
            lastJumpTime: 0,
            jumpHistory: [],
            firstInputTime: null,
            inputHistory: [],
            landingShake: 0,
          };
          tracking.current = {
            leftFrames: 0,
            rightFrames: 0,
            stopFrames: 0,
            momentumBreaks: 0,
            jumpCoyoteTimes: [],
            deathCoords: [],
          };

          trails.current = [];
          particles.current = new ParticleSystem();
          movingPlatforms.current = JSON.parse(
            JSON.stringify(level.platforms || []),
          );
          movingHazards.current = JSON.parse(
            JSON.stringify(level.hazards || []),
          );
          collectibles.current = JSON.parse(
            JSON.stringify(level.collectibles || []),
          );
        }, [level]);

        useEffect(() => {
          reset();
        }, [level, reset]);

        useEffect(() => {
          const handleKeyDown = (e) => {
            if (e.repeat) return;
            if (
              [
                "Space",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
              ].includes(e.code)
            ) {
              e.preventDefault();
            }
            keys.current[e.code] = true;
            physState.current.inputHistory.push(Date.now());
            if (["Space", "ArrowUp", "KeyW"].includes(e.code)) {
              physState.current.jumpBufferTimestamp = Date.now();
            }
          };
          const handleKeyUp = (e) => {
            keys.current[e.code] = false;
          };
          window.addEventListener("keydown", handleKeyDown);
          window.addEventListener("keyup", handleKeyUp);
          return () => {
            window.removeEventListener("keydown", handleKeyDown);
            window.removeEventListener("keyup", handleKeyUp);
          };
        }, []);

        const loop = useCallback(() => {
          if (!level) return;
          const p = player.current,
            ts = state.current.timeScale * state.current.timeMod,
            now = Date.now();
          const elapsed = now - state.current.startTime;

          if (p.vx < -0.1) tracking.current.leftFrames++;
          if (p.vx > 0.1) tracking.current.rightFrames++;

          if (
            Math.abs(p.vx) < 0.1 &&
            Math.abs(p.vy) < 0.1 &&
            state.current.moved
          ) {
            tracking.current.stopFrames++;
            if (tracking.current.stopFrames === 60) {
              onBehavior("HESITATION_ZONE", { x: p.x, y: p.y });
            }
          } else {
            tracking.current.stopFrames = 0;
          }

          if (!state.current.moved) {
            if (
              keys.current["ArrowLeft"] ||
              keys.current["KeyA"] ||
              keys.current["ArrowRight"] ||
              keys.current["KeyD"] ||
              keys.current["ArrowUp"] ||
              keys.current["KeyW"] ||
              keys.current["Space"]
            ) {
              state.current.moved = true;
              const hesitation = elapsed;
              physState.current.firstInputTime = hesitation;
              onBehavior("MOVEMENT_START", hesitation);
            } else if (
              elapsed > 3500 &&
              !state.current.behavioralFlags.idleLog
            ) {
              state.current.behavioralFlags.idleLog = true;
              onBehavior("IDLE");
            }
          }

          const recentInputs = physState.current.inputHistory.filter(
            (t) => now - t < 1000,
          ).length;
          if (recentInputs > 6 && !state.current.behavioralFlags.panicLog) {
            state.current.behavioralFlags.panicLog = true;
            onBehavior("PANIC");
            if (isAngerActive) state.current.shake += 10;
          }

          if (isAngerActive && intensity > 1.3 && Math.random() < 0.05) {
            state.current.shake += (intensity - 1.0) * 1.5;
          }

          let ridingPl = null;
          movingPlatforms.current.forEach((pl) => {
            if (pl.invisible) return;
            const isTop =
              state.current.gravityMod >= 0
                ? p.y + p.h >= pl.y - 4 && p.y + p.h <= pl.y + 12 && p.vy >= 0
                : p.y <= pl.y + pl.h + 4 &&
                  p.y >= pl.y + pl.h - 12 &&
                  p.vy <= 0;

            if (p.x < pl.x + pl.w && p.x + p.w > pl.x && isTop) ridingPl = pl;
          });

          [movingPlatforms.current, movingHazards.current].forEach((arr) => {
            arr.forEach((obj) => {
              if (obj.flicker) {
                const cycle = Math.floor(elapsed / (obj.flickerSpeed || 1000));
                obj.invisible = cycle % 2 !== 0;
              }
              if (obj === ridingPl && obj.decay) {
                obj.w = Math.max(0, obj.w - (obj.decayRate || 0.6));
                if (obj.w <= 0) obj.invisible = true;
              }
              if (
                obj === ridingPl &&
                obj.isRisky &&
                !state.current.behavioralFlags.riskTaken
              ) {
                state.current.behavioralFlags.riskTaken = true;
                onBehavior("RISK_PATH");
              }

              const mult =
                arr === movingHazards.current ? intensity * 1.05 : 1.0;
              if (obj.vx) {
                obj.x += obj.vx * ts * mult;
                if (obj.x < obj.minX || obj.x + obj.w > obj.maxX) {
                  obj.vx *= -1;
                  obj.x = Math.max(obj.minX, Math.min(obj.x, obj.maxX - obj.w));
                }
              }
              if (obj.vy) {
                obj.y += obj.vy * ts * mult;
                if (obj.y < obj.minY || obj.y + obj.h > obj.maxY) {
                  obj.vy *= -1;
                  obj.y = Math.max(obj.minY, Math.min(obj.y, obj.maxY - obj.h));
                }
              }
            });
          });

          let targetVx = 0;
          if (keys.current["ArrowLeft"] || keys.current["KeyA"])
            targetVx = -SPEED;
          if (keys.current["ArrowRight"] || keys.current["KeyD"])
            targetVx = SPEED;

          if (Math.abs(p.vx) > SPEED * 0.8 && Math.abs(targetVx) < 0.1) {
            tracking.current.momentumBreaks++;
          }

          const accel = p.onGround ? GROUND_ACCEL : AIR_ACCEL;
          p.vx += (targetVx - p.vx) * accel;
          if (Math.abs(p.vx) < 0.05) p.vx = 0;

          const isJumpPressed =
            keys.current["ArrowUp"] ||
            keys.current["KeyW"] ||
            keys.current["Space"];
          const canJump =
            now - physState.current.coyoteTimestamp < COYOTE_TIME &&
            !physState.current.hasJumpedInAir;
          const wantsJump =
            now - physState.current.jumpBufferTimestamp < JUMP_BUFFER;

          if (canJump && wantsJump) {
            p.vy = JUMP * (state.current.gravityMod < 0 ? -1 : 1);
            p.onGround = false;
            p.jumpCount++;
            physState.current.hasJumpedInAir = true;
            physState.current.jumpBufferTimestamp = 0;
            physState.current.jumpHistory.push(now);
            physState.current.jumpHistory =
              physState.current.jumpHistory.filter((t) => now - t < 5000);
            const coyoteUsed = now - physState.current.coyoteTimestamp;
            tracking.current.jumpCoyoteTimes.push(coyoteUsed);
            particles.current.spawn(p.x + p.w / 2, p.y + p.h, color);
            AudioSystem.playEffect("jump");
          }

          if (!isJumpPressed && !physState.current.jumpCut) {
            if (
              (state.current.gravityMod > 0 && p.vy < 0) ||
              (state.current.gravityMod < 0 && p.vy > 0)
            ) {
              p.vy *= 0.45;
              physState.current.jumpCut = true;
            }
          }

          if (!p.onGround) {
            const g =
              (p.vy * (state.current.gravityMod < 0 ? -1 : 1) > 0
                ? GRAVITY * FALL_MULT
                : GRAVITY) *
              state.current.gravityMod *
              ts;
            p.vy += g;
          }

          if (Math.abs(p.vx) > 0.5) trails.current.push({ x: p.x, y: p.y });
          if (trails.current.length > 5) trails.current.shift();

          if (ridingPl) {
            if (ridingPl.vx) p.x += ridingPl.vx * ts;
            if (ridingPl.vy) p.y += ridingPl.vy * ts;
            if (ridingPl.conveyor) p.x += ridingPl.conveyor * ts;
          }

          p.x += p.vx * ts;
          if (p.x < 0) p.x = 0;
          if (p.x > CANVAS_WIDTH - p.w) p.x = CANVAS_WIDTH - p.w;

          movingPlatforms.current.forEach((pl) => {
            if (pl.invisible) return;
            if (
              p.x < pl.x + pl.w &&
              p.x + p.w > pl.x &&
              p.y < pl.y + pl.h &&
              p.y + p.h > pl.y
            ) {
              const buffer = Math.abs(p.vx * ts) + 2;
              if (p.vx > 0 && p.x + p.w - p.vx * ts <= pl.x + buffer)
                p.x = pl.x - p.w;
              else if (p.vx < 0 && p.x - p.vx * ts >= pl.x + pl.w - buffer)
                p.x = pl.x + pl.w;
            }
          });

          const preColVy = p.vy;
          const prevOnGround = p.onGround;
          p.y += p.vy * ts;
          let onFloor = false;

          movingPlatforms.current.forEach((pl) => {
            if (pl.invisible) return;
            if (
              p.x < pl.x + pl.w &&
              p.x + p.w > pl.x &&
              p.y < pl.y + pl.h &&
              p.y + p.h > pl.y
            ) {
              const buffer = Math.abs(p.vy * ts) + 12;
              if (state.current.gravityMod >= 0) {
                if (p.vy >= 0 && p.y + p.h - p.vy * ts <= pl.y + buffer) {
                  p.y = pl.y - p.h;
                  p.vy = 0;
                  onFloor = true;
                } else if (
                  p.vy < 0 &&
                  p.y - p.vy * ts >= pl.y + pl.h - buffer
                ) {
                  p.y = pl.y + pl.h;
                  p.vy = 0;
                }
              } else {
                if (p.vy <= 0 && p.y - p.vy * ts >= pl.y + pl.h - buffer) {
                  p.y = pl.y + pl.h;
                  p.vy = 0;
                  onFloor = true;
                } else if (p.vy > 0 && p.y + p.h - p.vy * ts <= pl.y + buffer) {
                  p.y = pl.y - p.h;
                  p.vy = 0;
                }
              }
            }
          });
          p.onGround = onFloor;

          if (!prevOnGround && onFloor) {
            if (Math.abs(preColVy) > 1.0) {
              state.current.shake = 3;
              particles.current.spawn(p.x + p.w / 2, p.y + p.h, color, 8);
              AudioSystem.playEffect("land");
            }
            physState.current.coyoteTimestamp = now;
            physState.current.hasJumpedInAir = false;
            physState.current.jumpCut = false;
          }

          collectibles.current.forEach((c, idx) => {
            if (
              !c.collected &&
              p.x < c.x + c.w &&
              p.x + p.w > c.x &&
              p.y < c.y + c.h &&
              p.y + p.h > c.y
            ) {
              c.collected = true;
              state.current.collected.push(idx);
              AudioSystem.playEffect("jump");
            }
          });

          for (const h of movingHazards.current) {
            if (
              !h.invisible &&
              p.x < h.x + h.w &&
              p.x + p.w > h.x &&
              p.y < h.y + h.h &&
              p.y + p.h > h.y
            ) {
              tracking.current.deathCoords.push({ x: p.x, y: p.y });
              onFail({ x: p.x, y: p.y });
              state.current.shake = 25;
              AudioSystem.playEffect("death", intensity);
              return;
            }
          }

          if (p.y > CANVAS_HEIGHT + 100 || p.y < -100) {
            tracking.current.deathCoords.push({ x: p.x, y: p.y });
            onFail({ x: p.x, y: p.y });
            return;
          }
          if (state.current.shake > 0) state.current.shake *= 0.9;
          particles.current.update();

          const activeGoals = level.goals || (level.goal ? [level.goal] : []);
          const objType = level.objectiveType || OBJECTIVE_TYPES.REACH;
          const requiredCollect = level.requiredCollect || 0;
          const surviveTime = level.surviveTime || 0;
          const speedrunTime = level.speedrunTime || 999999;

          for (const g of activeGoals) {
            if (
              p.x < g.x + g.w &&
              p.x + p.w > g.x &&
              p.y < g.y + g.h &&
              p.y + p.h > g.y
            ) {
              let canComplete = false;
              switch (objType) {
                case OBJECTIVE_TYPES.COLLECT:
                  canComplete =
                    state.current.collected.length >= requiredCollect;
                  break;
                case OBJECTIVE_TYPES.SURVIVE:
                  canComplete = elapsed >= surviveTime;
                  break;
                case OBJECTIVE_TYPES.SEQUENCE:
                  canComplete = g.sequenceId === state.current.goalSequence;
                  if (canComplete) state.current.goalSequence++;
                  break;
                case OBJECTIVE_TYPES.SPEEDRUN:
                  canComplete = elapsed <= speedrunTime;
                  break;
                default:
                  canComplete = true;
              }
              if (
                canComplete ||
                (objType === OBJECTIVE_TYPES.SEQUENCE &&
                  g.sequenceId === state.current.goalSequence - 1)
              ) {
                state.current.timeScale = 0.1;
                AudioSystem.playEffect("success");
                setTimeout(
                  () =>
                    onComplete(g.action || "CONTINUE", {
                      time: elapsed,
                      jumps: p.jumpCount,
                      hesitation: physState.current.firstInputTime,
                      risk: state.current.behavioralFlags.riskTaken,
                      detailedTracking: tracking.current,
                      isCorrect: g.isCorrect,
                    }),
                  50,
                );
                return;
              }
            }
          }

          const ctx = canvasRef.current?.getContext("2d");
          if (ctx) {
            ctx.save();
            if (state.current.shake > 0)
              ctx.translate(
                (Math.random() - 0.5) * state.current.shake,
                (Math.random() - 0.5) * state.current.shake,
              );
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            if ((isAngerActive && intensity > 1.2) || level.theme === "RED") {
              const opacity =
                level.theme === "RED"
                  ? 0.3
                  : Math.min(0.2, (intensity - 1.2) * 0.15);
              ctx.fillStyle = `rgba(50, 0, 0, ${opacity})`;
              ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }

            if (level.question) {
              ctx.save();
              ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
              ctx.shadowBlur = 4;
              ctx.fillStyle = "rgba(255, 255, 255, 0.95)";
              ctx.font = "bold 20px JetBrains Mono";
              ctx.textAlign = "center";
              ctx.fillText(level.question, CANVAS_WIDTH / 2, 90);
              ctx.restore();
            }

            const renderRect = (x, y, w, h, color, fill = true) => {
              if (isAngerActive && intensity > 1.6 && Math.random() < 0.2) {
                ctx.fillStyle = "rgba(255,0,0,0.5)";
                ctx.fillRect(x + 3, y, w, h);
                ctx.fillStyle = "rgba(0,255,255,0.5)";
                ctx.fillRect(x - 3, y, w, h);
              }
              if (fill) {
                ctx.fillStyle = color;
                ctx.fillRect(x, y, w, h);
              } else {
                ctx.strokeStyle = color;
                ctx.strokeRect(x, y, w, h);
              }
            };

            movingPlatforms.current.forEach((pl) => {
              if (pl.invisible) return;
              let fill = isAngerActive
                ? "#ff8800"
                : pl.isRisky
                  ? "#bd93f9"
                  : level.theme === "RED"
                    ? "#ff8800"
                    : "#fff";
              if (pl.decay) fill = `rgba(255, 100, 100, ${0.3 + pl.w / 100})`;
              if (pl.flicker) fill = `rgba(0, 229, 255, 0.8)`;
              if (pl.conveyor) fill = `rgba(255, 255, 0, 0.8)`;
              renderRect(pl.x, pl.y, pl.w, pl.h, fill);
              if (pl.conveyor) {
                ctx.fillStyle = "rgba(0,0,0,0.3)";
                const offset = (elapsed * 0.1 * pl.conveyor) % 20;
                for (let i = -20; i < pl.w; i += 20) {
                  let xPos = pl.x + i + offset;
                  if (xPos > pl.x && xPos < pl.x + pl.w - 5)
                    ctx.fillRect(xPos, pl.y, 5, pl.h);
                }
              }
            });
            movingHazards.current.forEach((h) => {
              if (h.invisible) return;
              // Draw solid scarlet background
              renderRect(h.x, h.y, h.w, h.h, "#ff1a1a");
              // Draw warning diagonal hatches
              ctx.strokeStyle = "rgba(0,0,0,0.45)";
              ctx.lineWidth = 3;
              ctx.save();
              ctx.beginPath();
              ctx.rect(h.x, h.y, h.w, h.h);
              ctx.clip();
              for (let i = -h.h; i < h.w; i += 12) {
                ctx.moveTo(h.x + i, h.y);
                ctx.lineTo(h.x + i + h.h, h.y + h.h);
              }
              ctx.stroke();
              ctx.restore();
            });

            collectibles.current.forEach((c) => {
              if (!c.collected) {
                ctx.strokeStyle = "#00ff9d";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(c.x + c.w / 2, c.y + c.h / 2, c.w / 2, 0, Math.PI * 2);
                ctx.stroke();
              }
            });

            activeGoals.forEach((g) => {
              const canAccess = true;
              ctx.shadowColor = goalColor;
              ctx.shadowBlur = 10;
              renderRect(
                g.x,
                g.y,
                g.w,
                g.h,
                canAccess ? goalColor : "rgba(255,255,255,0.3)",
                false,
              );
              ctx.shadowBlur = 0;

              if (showLabels && g.label) {
                ctx.fillStyle = goalColor;
                ctx.font = "bold 13px JetBrains Mono";
                ctx.textAlign = "center";
                if (g.textInside) {
                  ctx.fillText(g.label, g.x + g.w / 2, g.y + g.h / 2 + 5);
                } else {
                  ctx.fillText(g.label, g.x + g.w / 2, g.y - 12);
                }
              }
              if (
                objType === OBJECTIVE_TYPES.SEQUENCE &&
                g.sequenceId !== undefined
              ) {
                ctx.fillStyle = goalColor;
                ctx.font = "bold 12px JetBrains Mono";
                ctx.textAlign = "center";
                ctx.fillText(
                  `${g.sequenceId + 1}`,
                  g.x + g.w / 2,
                  g.y + g.h / 2 + 4,
                );
              }
            });

            particles.current.draw(ctx);
            trails.current.forEach((t, i) => {
              ctx.globalAlpha = (i / 6) * 0.4;
              ctx.fillStyle = isAngerActive ? "#ff0000" : "#00e5ff";
              ctx.fillRect(t.x, t.y, p.w, p.h);
            });
            ctx.globalAlpha = 1;
            ctx.fillStyle = color;
            ctx.fillRect(p.x, p.y, p.w, p.h);

            // UI
            ctx.fillStyle = "rgba(0, 229, 255, 0.8)";
            ctx.font = "bold 11px JetBrains Mono";
            ctx.textAlign = "left";
            if (objType === OBJECTIVE_TYPES.COLLECT)
              ctx.fillText(
                `COLLECT: ${state.current.collected.length}/${requiredCollect}`,
                10,
                20,
              );
            else if (objType === OBJECTIVE_TYPES.SURVIVE)
              ctx.fillText(
                `SURVIVE: ${Math.max(0, (surviveTime - elapsed) / 1000).toFixed(1)}s`,
                10,
                20,
              );
            else if (objType === OBJECTIVE_TYPES.SPEEDRUN)
              ctx.fillText(
                `TIME: ${Math.max(0, (speedrunTime - elapsed) / 1000).toFixed(1)}s`,
                10,
                20,
              );

            ctx.restore();
          }
          onStats({ time: elapsed, jumps: p.jumpCount });
          requestRef.current = requestAnimationFrame(loop);
        }, [
          level,
          onComplete,
          onFail,
          onStats,
          onBehavior,
          color,
          goalColor,
          showLabels,
          isAngerActive,
          intensity,
        ]);

        useEffect(() => {
          requestRef.current = requestAnimationFrame(loop);
          return () => cancelAnimationFrame(requestRef.current);
        }, [loop]);

        return React.createElement(
          "div",
          {
            className:
              "relative flex justify-center items-center w-full h-full max-w-[100vw] overflow-hidden",
          },
          React.createElement("canvas", {
            ref: canvasRef,
            width: CANVAS_WIDTH,
            height: CANVAS_HEIGHT,
            className:
              "border border-white/10 bg-black/80 shadow-2xl max-w-full h-full object-contain",
          }),
          React.createElement(
            "div",
            {
              className:
                "md:hidden absolute bottom-4 w-full flex justify-between px-6 z-40 touch-none",
            },
            React.createElement(
              "div",
              { className: "flex gap-4" },
              React.createElement(
                "button",
                {
                  className:
                    "w-16 h-16 bg-white/10 active:bg-white/40 rounded-full flex items-center justify-center text-white/80 select-none backdrop-blur-md border border-white/20 text-2xl",
                  onPointerDown: (e) => {
                    e.preventDefault();
                    keys.current["ArrowLeft"] = true;
                    physState.current.inputHistory.push(Date.now());
                  },
                  onPointerCancel: (e) => {
                    e.preventDefault();
                    keys.current["ArrowLeft"] = false;
                  },
                  onPointerUp: (e) => {
                    e.preventDefault();
                    keys.current["ArrowLeft"] = false;
                  },
                },
                "←",
              ),
              React.createElement(
                "button",
                {
                  className:
                    "w-16 h-16 bg-white/10 active:bg-white/40 rounded-full flex items-center justify-center text-white/80 select-none backdrop-blur-md border border-white/20 text-2xl",
                  onPointerDown: (e) => {
                    e.preventDefault();
                    keys.current["ArrowRight"] = true;
                    physState.current.inputHistory.push(Date.now());
                  },
                  onPointerCancel: (e) => {
                    e.preventDefault();
                    keys.current["ArrowRight"] = false;
                  },
                  onPointerUp: (e) => {
                    e.preventDefault();
                    keys.current["ArrowRight"] = false;
                  },
                },
                "→",
              ),
            ),
            React.createElement(
              "button",
              {
                className:
                  "w-16 h-16 bg-[#00ff9d]/20 active:bg-[#00ff9d]/60 rounded-full flex items-center justify-center text-[#00ff9d] select-none backdrop-blur-md border border-[#00ff9d]/40 text-2xl",
                onPointerDown: (e) => {
                  e.preventDefault();
                  keys.current["Space"] = true;
                  physState.current.jumpBufferTimestamp = Date.now();
                  physState.current.inputHistory.push(Date.now());
                },
                onPointerCancel: (e) => {
                  e.preventDefault();
                  keys.current["Space"] = false;
                },
                onPointerUp: (e) => {
                  e.preventDefault();
                  keys.current["Space"] = false;
                },
              },
              "↑",
            ),
          ),
        );
      };

      // --- App Logic ---
      const App = () => {
        useEffect(() => {
          const preventScroll = (e) => {
            if (
              [
                "Space",
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
              ].includes(e.code)
            ) {
              e.preventDefault();
            }
          };
          window.addEventListener("keydown", preventScroll, { passive: false });
          return () => window.removeEventListener("keydown", preventScroll);
        }, []);

        const [phase, setPhase] = useState("BOOT");
        const [levelIdx, setLevelIdx] = useState(0);
        const [recoveryIdx, setRecoveryIdx] = useState(0);
        const [recoveryCount, setRecoveryCount] = useState(0);
        const [logs, setLogs] = useState([]);
        const [showDetailedLogs, setShowDetailedLogs] = useState(false);
        const [showDossier, setShowDossier] = useState(false);
        const [profile, setProfile] = useState([0.5, 0.5, 0.5, 0.5, 0.5]);
        const [stats, setStats] = useState({ time: 0, jumps: 0 });
        const [totalJumps, setTotalJumps] = useState(0);
        const [totalTime, setTotalTime] = useState(0);
        const [deaths, setDeaths] = useState(0);
        const [behaviorStats, setBehaviorStats] = useState({
          idleCount: 0,
          rapidImprovement: 0,
          persistentFailures: 0,
          panicCount: 0,
          hesitationTotal: 0,
          riskTaken: 0,
          riskSuccess: 0,
        });
        const [intensity, setIntensity] = useState(1.0);
        const [finalRes, setFinalRes] = useState(null);
        const [resetKey, setResetKey] = useState(0);
        const [sessionPool, setSessionPool] = useState([]);
        const [sectorHistory, setSectorHistory] = useState([]);
        const [loadingProgress, setLoadingProgress] = useState(0);

        const [intensityHistory, setIntensityHistory] = useState([]);
        const [stressHistory, setStressHistory] = useState([]);

        const displayedLogs = logs.filter((l) => {
          if (showDetailedLogs) return true;
          const text = l.text;
          if (text.includes("Idle state detected")) return false;
          if (text.includes("Stress response detected")) return false;
          if (text.includes("Hesitation Zone mapped")) return false;
          if (text.includes("Observation ongoing")) return false;
          if (text.includes("Motor functions within parameters")) return false;
          if (text.includes("I am watching")) return false;
          if (text.includes("Optimization required")) return false;
          if (text.includes("Do not hesitate")) return false;
          if (text.includes("Interesting choice")) return false;
          if (text.includes("The machine learns from you")) return false;
          if (text.includes("Continue protocol")) return false;
          if (text.includes("Calibration error")) return false;
          if (text.includes("Calibration failed")) return false;
          if (text.includes("failing to adjust tactical approach"))
            return false;
          if (text.includes("Neural plasticity exceeding")) return false;
          if (text.includes("Kinetic failure at")) return false;
          return true;
        });

        const logEndRef = useRef(null);

        const levelDeaths = useRef(0);
        const deathTimestamp = useRef(0);
        const lastLevelTime = useRef(0);
        const deathStreak = useRef(0);

        const addLog = useCallback((m, priority = "INFO") => {
          setLogs((prev) => [
            ...prev.slice(-40),
            {
              id: Math.random(),
              text: `[${new Date().toLocaleTimeString().split(" ")[0]}] ${m}`,
              className:
                priority === "WARN"
                  ? "log-error"
                  : priority === "ACES"
                    ? "log-aces"
                    : priority === "ALERT"
                      ? "log-alert"
                      : "log-info",
            },
          ]);
        }, []);

        useEffect(() => {
          const initAudio = () => {
            AudioSystem.init();
            window.removeEventListener("click", initAudio);
            window.removeEventListener("keydown", initAudio);
          };
          window.addEventListener("click", initAudio);
          window.addEventListener("keydown", initAudio);

          // CLOUD SAVE CHECKEN BIJ OPSTARTEN
          async function loadCloudAces() {
            if (window.loadGameData) {
              try {
                const cloudData = await window.loadGameData('aces');
                if (cloudData) {
                  if (cloudData.unlocks) {
                    const localUnlocks = JSON.parse(localStorage.getItem("aces_unlocks") || "[]");
                    const combined = Array.from(new Set([...localUnlocks, ...cloudData.unlocks]));
                    localStorage.setItem("aces_unlocks", JSON.stringify(combined));
                  }
                  if (cloudData.tutCompleted) {
                    localStorage.setItem("aces_tut_completed", "true");
                  }
                  if (cloudData.lastSession) {
                    const localFinal = JSON.parse(localStorage.getItem("aces_final") || "null");
                    if (!localFinal || (cloudData.lastSave || 0) > (localFinal.lastSave || 0)) {
                      localStorage.setItem("aces_final", JSON.stringify(cloudData.lastSession));
                    }
                  }
                  addLog("ACES: Cloud Profile Data Loaded.", "ACES");
                }
              } catch(e) {
                console.warn("Cloud load error:", e);
              }
            }
          }
          loadCloudAces();

          return () => {
            window.removeEventListener("click", initAudio);
            window.removeEventListener("keydown", initAudio);
          };
        }, [addLog]);

        useEffect(() => {
          if (logEndRef.current && logEndRef.current.parentElement) {
            logEndRef.current.parentElement.scrollTop =
              logEndRef.current.parentElement.scrollHeight;
          }
        }, [logs]);

        // --- AI CHATTER ---
        useEffect(() => {
          const interval = setInterval(() => {
            if (phase === "EVALUATION" && Math.random() < 0.4) {
              const msgs = [
                "ACES: Observation ongoing.",
                "ACES: Motor functions within parameters.",
                "ACES: I am watching.",
                "ACES: Optimization required.",
                "ACES: Do not hesitate.",
                "ACES: Interesting choice.",
                "ACES: The machine learns from you.",
                "ACES: Continue protocol.",
              ];
              addLog(msgs[Math.floor(Math.random() * msgs.length)], "INFO");
            }
          }, 5000);
          return () => clearInterval(interval);
        }, [phase, addLog]);

        // --- POOLS ---

        const TUTORIAL_POOL = [
          {
            title: "TUT_01",
            instr: "CALIBRATION: MOVEMENT",
            hint: "USE [W][A][S][D] OR [ARROWS] TO MOVE",
            start: { x: 50, y: 400 },
            goal: { x: 750, y: 380, w: 50, h: 60 },
            platforms: [{ x: 0, y: 440, w: 840, h: 40 }],
          },
          {
            title: "TUT_02",
            instr: "CALIBRATION: KINETICS",
            hint: "USE [SPACE] OR [UP] TO JUMP OVER VOIDS",
            start: { x: 50, y: 400 },
            goal: { x: 750, y: 380, w: 50, h: 60 },
            platforms: [
              { x: 0, y: 440, w: 320, h: 40 },
              { x: 450, y: 440, w: 390, h: 40 },
            ],
          },
          {
            title: "TUT_03",
            instr: "CALIBRATION: THREATS",
            hint: "AVOID BLOWING RED HAZARDS. PURPLE PLATFORMS INDICATE HIGH-RISK PATHWAYS.",

                                    sectorInfo: sectorHistory,
                                    height: 60,
                                  }),
                                ),
                              ),
                            ),
                          ),

                          React.createElement(
                            "div",
                            { className: "flex gap-4" },
                            React.createElement(
                              "button",
                              {
                                onClick: () => {
                                  setPhase("BOOT");
                                  setFinalRes(null);
                                  setLevelIdx(0);
                                  setShowDossier(false);
                                },
                                className: "btn-primary",
                              },
                              "RETURN TO HUB",
                            ),
                            React.createElement(
                              "button",
                              {
                                onClick: () => {
                                  const shareText = `ACES PSYCHOMETRIC ANALYSIS\n\nProfile: ${finalRes.archetype}\n"${finalRes.humanTranslation}"\n\nRSK: ${finalRes.dimensions.risk} | PAT: ${finalRes.dimensions.patience} | ADP: ${finalRes.dimensions.adapt} | CNS: ${finalRes.dimensions.consist} | CNF: ${finalRes.dimensions.conf}\n\nTest your cognitive & motor profile here: ${window.location.href}`;
                                  if (navigator.share) {
                                    navigator
                                      .share({
                                        title: "ACES Analysis",
                                        text: shareText,
                                      })
                                      .catch(console.error);
                                  } else {
                                    navigator.clipboard.writeText(shareText);
                                    alert("Analysis copied to clipboard.");
                                  }
                                },
                                className:
                                  "px-4 py-2 border border-blue-500/50 hover:border-blue-400 bg-blue-900/20 hover:bg-blue-800/40 text-blue-400 text-[10px] font-black tracking-widest uppercase transition-all duration-300 cursor-pointer shadow-[0_0_15px_rgba(0,229,255,0.1)]",
                              },
                              "SHARE PROFILE",
                            ),
                            React.createElement(
                              "button",
                              {
                                onClick: deleteSession,
                                className: "btn-danger",
                              },
                              "DELETE SESSION",
                            ),
                          ),
                        ),
                )
              : React.createElement(
                  "div",
                  { className: "flex gap-6 items-start" },
                  React.createElement(
                    "div",
                    {
                      className:
                        "terminal-window w-72 h-[600px] flex flex-col p-4 shadow-2xl relative",
                    },
                    React.createElement(
                      "div",
                      {
                        className:
                          "text-[10px] mb-2 font-black tracking-widest flex justify-between items-center",
                      },
                      React.createElement(
                        "span",
                        { className: "opacity-40" },
                        "DIAGNOSTIC_LOGS",
                      ),
                      React.createElement(
                        "button",
                        {
                          onClick: () => setShowDetailedLogs(!showDetailedLogs),
                          className: `px-1.5 py-0.5 border text-[7px] tracking-tight transition-all uppercase cursor-pointer ${showDetailedLogs ? "border-blue-500 text-blue-400 bg-blue-500/10 font-bold" : "border-white/20 text-white/40 hover:text-white/80 hover:border-white/40"}`,
                        },
                        showDetailedLogs
                          ? "SHOW DETAILS: ON"
                          : "SHOW DETAILS: OFF",
                      ),
                    ),
                    React.createElement(
                      "div",
                      {
                        className:
                          "flex-1 overflow-y-auto custom-scrollbar pr-2 mb-2",
                      },
                      displayedLogs.map((l) =>
                        React.createElement(
                          "div",
                          { key: l.id, className: `log-item ${l.className}` },
                          l.text,
                        ),
                      ),
                      React.createElement("div", { ref: logEndRef }),
                    ),
                    React.createElement(
                      "div",
                      { className: "border-t border-white/10 pt-4" },
                      React.createElement(
                        "div",
                        {
                          className:
                            "flex justify-between text-[8px] opacity-40 mb-1 font-bold",
                        },
                        React.createElement(
                          "span",
                          null,
                          "LIVE PSYCH_PROFILE (Adapts to behavior)",
                        ),
                        React.createElement("span", null, "ACTIVE"),
                      ),
                      React.createElement(SpiderChart, {
                        data: profile,
                        size: 160,
                      }),
                    ),
                  ),
                  React.createElement(
                    "div",
                    { className: "flex flex-col items-center" },
                    React.createElement(
                      "div",
                      {
                        className:
                          "mb-4 flex gap-12 text-[10px] opacity-40 uppercase tracking-[0.3em] font-black",
                      },
                      React.createElement(
                        "div",
                        { className: "flex items-center gap-2" },
                        React.createElement("span", {
                          className: `w-2 h-2 rounded-full ${intensity > 1.5 ? "bg-red-500 animate-pulse" : "bg-blue-500"}`,
                        }),
                        React.createElement("span", null, currentLevel.title),
                      ),
                      React.createElement(
                        "div",
                        null,
                        phase === "BOOT" ? "STABLE_HUB" : "LIVE_CAPTURE",
                      ),
                    ),
                    React.createElement(
                      "div",
                      {
                        className: "relative w-full max-w-[840px]",
                        style: { aspectRatio: "840/480" },
                      },
                      React.createElement(
                        "div",
                        {
                          className: `directive-overlay ${phase === "RECOVERY" ? "text-red-500" : ""}`,
                        },
                        currentLevel.instr,
                      ),
                      phase === "TUTORIAL" &&
                        currentLevel.hint &&
                        React.createElement(
                          "div",
                          { className: "tutorial-hint" },
                          currentLevel.hint,
                        ),
                      React.createElement(GameCanvas, {
                        key:
                          (currentLevel.title || "level") +
                          resetKey +
                          (phase === "RECOVERY" ? recoveryIdx : ""),
                        level: currentLevel,
                        onComplete: handleComplete,
                        onFail: handleFail,
                        onStats: setStats,
                        onBehavior: handleBehavior,
                        showLabels: true,
                        isAngerActive: phase === "RECOVERY",
                        intensity: intensity,
                      }),
                    ),
                    React.createElement(
                      "div",
                      { className: "grid grid-cols-3 gap-6 mt-6 w-full" },
                      [
                        {
                          L: "SECTOR",
                          V: `${phase === "BOOT" ? "00" : levelIdx + 1}/${sessionPool.length || 19}`,
                        },
                        { L: "INTENSITY", V: intensity.toFixed(2) },
                        { L: "DRIFT", V: deaths },
                      ].map((m) =>
                        React.createElement(
                          "div",
                          { key: m.L, className: "metric-box shadow-xl" },
                          React.createElement(
                            "span",
                            {
                              className:
                                "text-[10px] opacity-40 font-bold tracking-widest",
                            },
                            m.L,
                          ),
                          React.createElement(
                            "span",
                            {
                              className: `text-3xl font-black ${m.L === "DRIFT" && deaths > 0 ? "text-red-500" : ""}`,
                            },
                            m.V,
                          ),
                        ),
                      ),
                    ),
                  ),
                ),
        );
      };

      createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
  <div class="sr-only">
    <h1>Play ACES Free Online - Psychological Platformer</h1>
    <p>ACES is a free online browser game that tests your motor skills and cognitive logic to build a psychometric profile. Play instantly on GamingNest without downloading.</p>
  </div>
  <div class="scanline"></div>
</html>
