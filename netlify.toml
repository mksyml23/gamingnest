# Preview branch: mobile assets applied only in deploy-preview context.
[build]
  publish = "soepgames"

[context.deploy-preview]
  command = "python3 scripts/apply-preview-patch.py && python3 scripts/apply-account-aces-overlay.py && python3 scripts/apply-aces-ad-experiment.py && python3 scripts/apply-aces-preview-skins.py && python3 scripts/apply-aces-safe-cosmetics.py && python3 scripts/apply-aces-ad-reward.py && node scripts/apply-aces-preview-firebase-counter.cjs && python3 scripts/apply-mobile-preview.py"
  publish = ".preview-publish"

[context.branch-deploy]
  command = "python3 scripts/apply-preview-patch.py && python3 scripts/apply-account-aces-overlay.py && python3 scripts/apply-aces-ad-experiment.py && python3 scripts/apply-aces-preview-skins.py && python3 scripts/apply-aces-safe-cosmetics.py && python3 scripts/apply-aces-ad-reward.py && node scripts/apply-aces-preview-firebase-counter.cjs"
  publish = ".preview-publish"
